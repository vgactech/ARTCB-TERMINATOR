[package]
name = "artcb-guardian-core"
version = "0.1.0"
edition = "2021"
description = "ARTCB Guardian — Security Core Rust (C-01 à C-08)"
license = "Proprietary"
authors = ["ARTCB Project"]

[lib]
name = "artcb_guardian_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "guardian"
path = "src/main.rs"

[dependencies]
# Sérialisation JSON canonique (JCS RFC 8785)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# UUID v7
uuid = { version = "1", features = ["v7"] }
# SHA-256
sha2 = "0.10"
# Temps
chrono = { version = "0.4", features = ["serde"] }
# Erreurs
thiserror = "2"
# Hex encoding
hex = "0.4"
# PyO3 — binding Python (feature optionnelle pour ne pas bloquer cargo test normal)
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

[dev-dependencies]
# Tests
tempfile = "3"

[features]
python = ["pyo3"]

[profile.release]
opt-level = 3
lto = true
