[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "artcb-guardian-core"
version = "0.1.0"
description = "ARTCB Guardian Core — Security bindings Python (C-08)"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
]

[tool.maturin]
# Feature "python" active PyO3
features = ["python"]
module-name = "artcb_guardian_core"
python-source = "python"
